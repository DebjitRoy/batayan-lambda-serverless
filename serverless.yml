service: batayan-serverless
frameworkVersion: "4"

plugins:
  - serverless-offline

package:
  patterns:
    - "!src/migration/**"
    - "!.recovery/**"
    - "!.local/**"
    - "!migration-reports/**"
    - "!.env*"
    - "!tests/**"
    - "!scripts/**"
    - "!docs/**"

provider:
  name: aws
  runtime: nodejs22.x
  region: ${env:AWS_REGION, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  httpApi:
    cors: true
  environment:
    POSTS_TABLE: ${self:service}-${sls:stage}-posts
    COMMENTS_TABLE: ${self:service}-${sls:stage}-comments
    USERS_TABLE: ${self:service}-${sls:stage}-users
    SERIES_TABLE: ${self:service}-${sls:stage}-series
    JOBS_TABLE: ${self:service}-${sls:stage}-jobs
    DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    LAMBDA_ENDPOINT: ${env:LAMBDA_ENDPOINT, 'http://localhost:4002'}
    JWT_SECRET: ${env:JWT_SECRET, ''}
    S3_BUCKET: ${env:S3_BUCKET, 'batayan-blog-images-${sls:stage}'}
    S3_PUBLIC_BASE_URL: ${env:S3_PUBLIC_BASE_URL, ''}
    OPENAI_API_KEY: ${env:OPENAI_API_KEY, ''}
    BACKGROUND_JOB_WORKER_FUNCTION_NAME: ${self:service}-${sls:stage}-backgroundJobWorker
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: "1"
  logRetentionInDays: 14
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:ConditionCheckItem
          Resource:
            - !GetAtt PostsTable.Arn
            - !GetAtt CommentsTable.Arn
            - !GetAtt UsersTable.Arn
            - !GetAtt SeriesTable.Arn
            - !GetAtt JobsTable.Arn
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:PutObjectAcl
          Resource:
            - arn:aws:s3:::${env:S3_BUCKET, 'batayan-blog-images-${sls:stage}'}/*
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - Fn::Sub: arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-backgroundJobWorker

build:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    format: cjs

custom:
  serverless-offline:
    httpPort: 4000
    lambdaPort: 4002

functions:
  authRegister:
    handler: src/handlers/auth.register
    events:
      - httpApi:
          method: POST
          path: /api/auth/register
  authLogin:
    handler: src/handlers/auth.login
    events:
      - httpApi:
          method: POST
          path: /api/auth/login
  listSeries:
    handler: src/handlers/series.list
    events:
      - httpApi:
          method: GET
          path: /api/series
  getSeries:
    handler: src/handlers/series.get
    events:
      - httpApi:
          method: GET
          path: /api/series/{seriesId}
  createSeries:
    handler: src/handlers/series.create
    events:
      - httpApi:
          method: POST
          path: /api/series
  updateSeries:
    handler: src/handlers/series.update
    events:
      - httpApi:
          method: PUT
          path: /api/series/{seriesId}
  deleteSeries:
    handler: src/handlers/series.remove
    events:
      - httpApi:
          method: DELETE
          path: /api/series/{seriesId}
  listPosts:
    handler: src/handlers/posts.list
    events:
      - httpApi:
          method: GET
          path: /api/posts
  getPost:
    handler: src/handlers/posts.get
    events:
      - httpApi:
          method: GET
          path: /api/posts/{postId}
  createPost:
    handler: src/handlers/posts.create
    events:
      - httpApi:
          method: POST
          path: /api/posts
  updatePost:
    handler: src/handlers/posts.update
    events:
      - httpApi:
          method: PUT
          path: /api/posts/{postId}
  updatePostStatus:
    handler: src/handlers/posts.updateStatus
    events:
      - httpApi:
          method: PUT
          path: /api/posts/{postId}/status
  deletePost:
    handler: src/handlers/posts.remove
    events:
      - httpApi:
          method: DELETE
          path: /api/posts/{postId}
  uploadPostHero:
    handler: src/handlers/uploads.hero
    events:
      - httpApi:
          method: PUT
          path: /api/posts/{postId}/upload
  uploadPostSection:
    handler: src/handlers/uploads.section
    events:
      - httpApi:
          method: PUT
          path: /api/posts/{postId}/sectionupload/{sectionId}
  listComments:
    handler: src/handlers/comments.list
    events:
      - httpApi:
          method: GET
          path: /api/posts/{postId}/comments
  getComment:
    handler: src/handlers/comments.get
    events:
      - httpApi:
          method: GET
          path: /api/posts/{postId}/comments/{commentId}
  createComment:
    handler: src/handlers/comments.create
    events:
      - httpApi:
          method: POST
          path: /api/posts/{postId}/comments
  updateComment:
    handler: src/handlers/comments.update
    events:
      - httpApi:
          method: PUT
          path: /api/posts/{postId}/comments/{commentId}
  replyComment:
    handler: src/handlers/comments.reply
    events:
      - httpApi:
          method: PUT
          path: /api/posts/{postId}/comments/{commentId}/reply
  deleteComment:
    handler: src/handlers/comments.remove
    events:
      - httpApi:
          method: DELETE
          path: /api/posts/{postId}/comments/{commentId}
  createSummary:
    handler: src/handlers/summary.createSummary
    events:
      - httpApi:
          method: POST
          path: /api/summary
  createGrammerCheck:
    handler: src/handlers/grammerCheck.createGrammerCheck
    events:
      - httpApi:
          method: POST
          path: /api/grammer-check
  getGrammerCheck:
    handler: src/handlers/grammerCheck.getGrammerCheck
    events:
      - httpApi:
          method: GET
          path: /api/grammer-check/{jobId}
  getWorkerByJobId:
    handler: src/handlers/grammerCheck.getWorkerByJobId
    events:
      - httpApi:
          method: GET
          path: /api/worker/{jobId}
  backgroundJobWorker:
    handler: src/handlers/grammerCheck.processBackgroundJob
    timeout: 120

resources:
  Conditions:
    IsProduction: !Equals ["${sls:stage}", prod]
    CreateBudget: !And
      - !Equals ["${sls:stage}", prod]
      - !Not [!Equals ["${env:BUDGET_ALERT_EMAIL, ''}", ""]]
  Resources:
    PostsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:service}-${sls:stage}-posts
        TableClass: STANDARD
        BillingMode: PROVISIONED
        DeletionProtectionEnabled: !If [IsProduction, true, false]
        AttributeDefinitions:
          - AttributeName: _id
            AttributeType: S
        KeySchema:
          - AttributeName: _id
            KeyType: HASH
        ProvisionedThroughput:
          ReadCapacityUnits: !If [IsProduction, 10, 1]
          WriteCapacityUnits: !If [IsProduction, 15, 1]
    CommentsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:service}-${sls:stage}-comments
        TableClass: STANDARD
        BillingMode: PROVISIONED
        DeletionProtectionEnabled: !If [IsProduction, true, false]
        AttributeDefinitions:
          - AttributeName: post
            AttributeType: S
          - AttributeName: _id
            AttributeType: S
        KeySchema:
          - AttributeName: post
            KeyType: HASH
          - AttributeName: _id
            KeyType: RANGE
        ProvisionedThroughput:
          ReadCapacityUnits: !If [IsProduction, 2, 1]
          WriteCapacityUnits: !If [IsProduction, 2, 1]
    UsersTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:service}-${sls:stage}-users
        TableClass: STANDARD
        BillingMode: PROVISIONED
        DeletionProtectionEnabled: !If [IsProduction, true, false]
        AttributeDefinitions:
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: email
            KeyType: HASH
        ProvisionedThroughput:
          ReadCapacityUnits: !If [IsProduction, 1, 1]
          WriteCapacityUnits: !If [IsProduction, 1, 1]
    SeriesTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:service}-${sls:stage}-series
        TableClass: STANDARD
        BillingMode: PROVISIONED
        DeletionProtectionEnabled: !If [IsProduction, true, false]
        AttributeDefinitions:
          - AttributeName: seriesId
            AttributeType: S
          - AttributeName: recordKey
            AttributeType: S
        KeySchema:
          - AttributeName: seriesId
            KeyType: HASH
          - AttributeName: recordKey
            KeyType: RANGE
        ProvisionedThroughput:
          ReadCapacityUnits: !If [IsProduction, 1, 1]
          WriteCapacityUnits: !If [IsProduction, 1, 1]
    JobsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:service}-${sls:stage}-jobs
        TableClass: STANDARD
        BillingMode: PROVISIONED
        DeletionProtectionEnabled: !If [IsProduction, true, false]
        AttributeDefinitions:
          - AttributeName: _id
            AttributeType: S
        KeySchema:
          - AttributeName: _id
            KeyType: HASH
        ProvisionedThroughput:
          ReadCapacityUnits: !If [IsProduction, 3, 1]
          WriteCapacityUnits: !If [IsProduction, 3, 1]
    MonthlyBudget:
      Type: AWS::Budgets::Budget
      Condition: CreateBudget
      Properties:
        Budget:
          BudgetName: ${self:service}-monthly-account-spend
          BudgetType: COST
          TimeUnit: MONTHLY
          BudgetLimit:
            Amount: 5
            Unit: USD
        NotificationsWithSubscribers:
          - Notification:
              NotificationType: ACTUAL
              ComparisonOperator: GREATER_THAN
              ThresholdType: ABSOLUTE_VALUE
              Threshold: 1
            Subscribers:
              - SubscriptionType: EMAIL
                Address: ${env:BUDGET_ALERT_EMAIL, ''}
          - Notification:
              NotificationType: ACTUAL
              ComparisonOperator: GREATER_THAN
              ThresholdType: ABSOLUTE_VALUE
              Threshold: 2
            Subscribers:
              - SubscriptionType: EMAIL
                Address: ${env:BUDGET_ALERT_EMAIL, ''}
          - Notification:
              NotificationType: ACTUAL
              ComparisonOperator: GREATER_THAN
              ThresholdType: ABSOLUTE_VALUE
              Threshold: 3
            Subscribers:
              - SubscriptionType: EMAIL
                Address: ${env:BUDGET_ALERT_EMAIL, ''}
          - Notification:
              NotificationType: ACTUAL
              ComparisonOperator: GREATER_THAN
              ThresholdType: ABSOLUTE_VALUE
              Threshold: 4
            Subscribers:
              - SubscriptionType: EMAIL
                Address: ${env:BUDGET_ALERT_EMAIL, ''}
          - Notification:
              NotificationType: ACTUAL
              ComparisonOperator: GREATER_THAN
              ThresholdType: ABSOLUTE_VALUE
              Threshold: 5
            Subscribers:
              - SubscriptionType: EMAIL
                Address: ${env:BUDGET_ALERT_EMAIL, ''}
    SpaRewriteCloudFrontFunction:
      Type: AWS::CloudFront::Function
      Properties:
        Name: ${self:service}-${sls:stage}-spa-rewrite
        AutoPublish: true
        FunctionConfig:
          Comment: Rewrite SPA browser routes to index.html while leaving API and asset requests alone.
          Runtime: cloudfront-js-1.0
        FunctionCode: |
          function handler(event) {
            var request = event.request;
            var uri = request.uri;

            if (
              uri === '/' ||
              uri.startsWith('/api/') ||
              uri.includes('.')
            ) {
              return request;
            }

            request.uri = '/index.html';
            return request;
          }
  Outputs:
    PostsTableName:
      Value: !Ref PostsTable
    CommentsTableName:
      Value: !Ref CommentsTable
    UsersTableName:
      Value: !Ref UsersTable
    SeriesTableName:
      Value: !Ref SeriesTable
    JobsTableName:
      Value: !Ref JobsTable
    SpaRewriteCloudFrontFunctionName:
      Description: CloudFront Function name for SPA route rewrites.
      Value:
        Ref: SpaRewriteCloudFrontFunction
